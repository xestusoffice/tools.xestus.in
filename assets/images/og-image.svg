<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient glowing orbs -->
  <circle cx="200" cy="150" r="180" fill="#6366f1" opacity="0.25" filter="url(#softGlow)" />
  <circle cx="1050" cy="480" r="220" fill="#06b6d4" opacity="0.2" filter="url(#softGlow)" />
  <circle cx="700" cy="100" r="150" fill="#ec4899" opacity="0.15" filter="url(#softGlow)" />

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="28" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Brand Pill -->
  <g transform="translate(100, 110)">
    <rect width="250" height="46" rx="23" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
    <circle cx="28" cy="23" r="6" fill="#10b981" />
    <text x="44" y="29" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="1">ENGINEERED BY XESTUS</text>
  </g>

  <!-- Title -->
  <text x="100" y="240" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
    Xestus OmniTools
  </text>
  <text x="100" y="310" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="700">
    The All-in-One Daily Online Utility Suite
  </text>

  <!-- Subtitle -->
  <text x="100" y="380" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
    100% Free, Private, Client-Side Tools for Images, PDFs, Coding, Security &amp; Daily Math.
  </text>
  <text x="100" y="415" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
    Zero file uploads. Zero lag. Complete browser-level data privacy.
  </text>

  <!-- Badges footer -->
  <g transform="translate(100, 480)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="220" height="48" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="24" y="30" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="600">🔒 100% In-Browser</text>

    <!-- Badge 2 -->
    <rect x="240" y="0" width="220" height="48" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="264" y="30" fill="#a78bfa" font-family="sans-serif" font-size="16" font-weight="600">⚡ Instant &amp; Unlimited</text>

    <!-- Badge 3 -->
    <rect x="480" y="0" width="220" height="48" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="504" y="30" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="600">🛡️ AdSense Verified</text>
  </g>
</svg>
